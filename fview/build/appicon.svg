<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- fview 图标正本:f_ 提示符(终端 prompt 直觉,块状等宽 f + accent 蓝光标)
       配色=app 默认主题:底 #0e1520 / 边框 #2c3a50 / f #e6e6e6 / 光标 #4a8fe0
       产线:rsvg-convert 出 1024 png(build/appicon.png,Wails 自动转 icns);
       magick 出 windows/icon.ico。改图只改本文件再重跑两条命令。 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- squircle:960 居中留边(现代 mac 图标不顶满格),圆角 22.5% -->
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="960" height="960" rx="216" fill="#0e1520"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="none" stroke="#2c3a50" stroke-width="8"/>

  <!-- 块状等宽 f:上横 / 竖笔 / 中横(组垂直中心 512,水平居中) -->
  <rect x="236" y="248" width="300" height="112" rx="20" fill="#e6e6e6"/>
  <rect x="236" y="248" width="112" height="528" rx="20" fill="#e6e6e6"/>
  <rect x="236" y="484" width="240" height="112" rx="20" fill="#e6e6e6"/>

  <!-- _ 光标:与竖笔底对齐,辉光一层 + 实体一层 -->
  <rect x="596" y="696" width="192" height="80" rx="20" fill="#4a8fe0" opacity="0.55" filter="url(#glow)"/>
  <rect x="596" y="696" width="192" height="80" rx="20" fill="#4a8fe0"/>
</svg>
